l_english:
 # 新增：王室内战胜利、一级政改、俄罗斯能力副本及一次性威克斯中立奖励。
 gcd_royal_victory:0 "王室的胜利"
 gcd_royal_guard_training:0 "王室卫兵训练"
 gcd_gawedi_monarchy:0 "加韦德君主制"
 gcd_gawedi_monarchy_desc:0 "内战结束后，王室收回大领主的部分土地与军役权，召集富商议会筹措税赋，并以直属王冠的卫兵守护王国。\n\n启用议会并保留贵族阶层，可通过“强制通过王室议案”决议整顿地方自治、完成阶层议案并使议席支持当前议案。"
 gcd_gawedi_mechanic:0 "加韦德王室权力"
 ability_gcd_gawedi_mechanic:0 "加韦德王室权力"
 gcd_gawedi_adm_power:0 "领主土地整顿进度"
 gcd_gawedi_dip_power:0 "富商议会资助进度"
 gcd_gawedi_mil_power:0 "王室卫兵训练进度"
 gcd_gawedi_adm_power_gain_modifier:0 "领主土地整顿进度增长修正"
 gcd_gawedi_dip_power_gain_modifier:0 "富商议会资助进度增长修正"
 gcd_gawedi_mil_power_gain_modifier:0 "王室卫兵训练进度增长修正"
 monthly_gcd_gawedi_adm_power:0 "每月领主土地整顿进度"
 monthly_gcd_gawedi_dip_power:0 "每月富商议会资助进度"
 monthly_gcd_gawedi_mil_power:0 "每月王室卫兵训练进度"
 GCD_GAWEDI_SEIZE_LORDS:0 "特辖领主土地"
 GCD_GAWEDI_SEIZE_LORDS_desc:0 "由王室派员整顿大领主的领地，降低本国省份自治度。"
 GCD_GAWEDI_FUND_COUNCIL:0 "资助富商议会"
 GCD_GAWEDI_FUND_COUNCIL_desc:0 "以王室的支持维持富商议会，压低国内叛乱派系的进度。"
 GCD_GAWEDI_ROYAL_GUARD:0 "训练王室卫兵"
 GCD_GAWEDI_ROYAL_GUARD_desc:0 "补充相当于一年增长的人力，并获得持续十年的陆军维护费 −10%、训练度 +5% 修正。"
 gcd_royal_autonomy_tt:0 "所有本国省份获得以下效果："
 gcd_royal_force_issue_title:0 "强制通过王室议案"
 gcd_royal_force_issue_desc:0 "以王室权威推动议案，使当前议会的所有议席转为支持，完成现有全部阶层议案，并将全部本国省份自治度降低15。此决议每十年可执行一次。"
 gcd_royal_force_issue_cooldown_tt:0 "过去十年内未执行“强制通过王室议案”"
 gcd_royal_force_issue_effect_tt:0 "所有本国省份自治度 §G−15§!。若有议会辩论，使全部本国议席支持当前议案；自动完成所有现有阶层议案。\n此决议进入 §Y10 年§! 冷却。"
 gcd_wex_neutrality_reward_tt:0 "§Y下一次§!我们主动向§Y洛伦特§!宣战时，§Y威克斯§!将保持中立，即使它与洛伦特结盟也不会参战。此效果仅用于这一场战争，§Y不会解除其同盟关系§!。"
 gcd_wex_neutrality_call_tt:0 "威克斯已承诺在加韦德此次对洛伦特的战争中保持中立"
 gcd_royal.1.t:0 "王室战后与外交奖励兼容接入"
 gcd_royal.1.d:0 "为旧存档接入王室内战胜利和威克斯中立奖励。"
 gcd_royal.1.a:0 "接入已完成内容的奖励。"
