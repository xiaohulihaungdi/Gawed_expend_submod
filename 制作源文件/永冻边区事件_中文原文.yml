l_english:
 gawed_yongdongbianqu.3.t:0 "永冻边区观察者"
 gawed_yongdongbianqu.3.d:0 "检查永冻边区是否已经独立存在。"
 gawed_yongdongbianqu.3.a:0 "安排归附事宜。"
 gawed_yongdongbianqu.4.t:0 "白湾的归化"
 gawed_yongdongbianqu.4.d:0 "我们将在指定的五个省份推行白湾文化。九十天后，阿德肖与永冻边区的归属问题将再次摆到王廷面前。"
 gawed_yongdongbianqu.4.a:0 "让他们成为白湾人。"
 gawed_yongdongbianqu.5.t:0 "永冻边区的归属"
 gawed_yongdongbianqu.5.d:0 "阿德肖与永冻边区如今都在我们的治下。我们可以准许它们脱离统治，承担随后爆发战争的后果；也可以维持现有安排，暂时降低它们的独立倾向。"
 gawed_yongdongbianqu.5.a:0 "让他们独立。"
 gawed_yongdongbianqu.5.b:0 "收紧缰绳。"
 gawed_yongdongbianqu.6.t:0 "背叛！"
 gawed_yongdongbianqu.6.d:0 "阿德肖与永冻边区获得独立后，选择以战争挑战加韦德的统治。"
 gawed_yongdongbianqu.6.a:0 "那就让他们见识真正的战争。"
 gcd_yongdongbianqu_war_preview_tt:0 "独立的阿德肖与永冻边区将在§Y1天后§!分别向加韦德宣战。"
 bumanderenmin:0 "不满的人民"
 desc_bumanderenmin:0 "现有统治安排暂时得到维持，但当地的不满仍在积聚。"
