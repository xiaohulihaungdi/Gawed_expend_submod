 gcd_welyam.40.a:0 "我们已知晓他们的选择。"
 gcd_welyam.100.t:0 "加韦德内战"
 gcd_welyam.100.a:0 "王国已然分裂。"
 gcd_welyam.101.t:0 "加韦德内战：加韦顿陷落"
 gcd_welyam.101.a:0 "王室败局已定。"
 gcd_welyam.102.t:0 "加韦德内战：王室的胜利"
 gcd_welyam.102.a:0 "重归王室治下。"
 gcd_welyam.103.t:0 "内战暂缓"
 gcd_welyam.103.d:0 "王室仅存首都，已无可用于建立大边区的非首都领土。内战尚未开始；大领主的威胁仍未消失。"
 gcd_welyam.103.a:0 "我们需要应对这场危机。"
 gcd_welyam_first_council:0 "第一次富商议会"
 gcd_welyam_royal_right_hand:0 "国王的左膀右臂"
 gcd_welyam_noble_settlement:0 "奥尔德沃德会议"
 gcd_welyam_crown_consolidation:0 "大领主之誓"
 gcd_welyam_great_hunt:0 "威利亚姆的大围猎"
 gcd_welyam_great_hunt_karina:0 "威利亚姆与卡丽娜的大围猎"
 gcd_welyam_council_preview_tt:0 "§G事件前瞻：第一次富商议会§!\n给予 §G25§! 政府改革点数、§G100§! 金币，以及 §G−20%§! 顾问花费，持续到当前君主死亡。"
 gcd_welyam_rebels_stopped_tt:0 "§G解除威利亚姆改革施加的富商贷款禁令。§!\n此后不再触发本灾难两年一次的贵族叛军。贵族忠诚均衡点 §R−10%§!，持续到灾难结束。"
 gcd_welyam_tier2_reform_tt:0 "若尚未采用 §Y赋予富商议会权力§!，将当前二级政府改革替换为此改革；其他层级政府改革保持不变。"
 gcd_welyam_task3_routes_preview_tt:0 "§Y完成方式一§!：\n将触发事件「§Y奥尔德沃德会议§! 」\n贵族忠诚均衡点 §G+30%§!、贵族影响力 §Y−10%§!，持续到当前君主死亡；此后§R加韦德内战不再触发§!。\n\n§Y完成方式二§!\n将触发事件「§Y大领主之誓§!  」\n没收贵族 §Y20%§! 土地，贵族忠诚度立即 §R−20§!；获得持续 §Y10 年§! 的全国叛乱度 §R+2§!、月度自治度 §G−0.1§! 修正。"
 gcd_welyam_settlement_preview_tt:0 "§Y事件前瞻：奥尔德沃德会议§!\n贵族忠诚均衡点 §G+30%§!、贵族影响力 §Y−10%§!，持续到当前君主死亡；此后加韦德内战不再触发。"
 gcd_welyam_consolidation_preview_tt:0 "§Y事件前瞻：大领主之誓§!\n没收贵族 §Y20%§! 土地，贵族忠诚度立即 §R−20§!；全国叛乱度 §R+2§!、月度自治度 §G−0.1§!，持续 §Y10 年§!。"
 gcd_welyam_civil_war_prevented_tt:0 "§G选择此选项后，加韦德内战将不再触发。§! 已经爆发的内战仍须通过战争结局结束。"
 gcd_welyam_hunt_preview_tt:0 "§G事件前瞻：威利亚姆的大围猎§!\n所有阶层忠诚度 §G+10§!，并给予持续 §Y15 年§! 的人情增长 §G+20%§!、外交声誉 §G+2§!。若选择选项时配偶为 §YKarina Deland§!，该修正额外给予侵略扩张影响 §G−15%§!、外交声誉 §G+2§!。"
 gcd_welyam_reform_finished_tt:0 "§G威利亚姆改革灾难立即结束。§! \n启用一级政府改革§Y“加韦德君主制”§!。"
 gcd_welyam_reform_modifier_duration_tt:0 "此修正按其原定期限保留，不随灾难结束移除。"
 gcd_welyam_civil_war_start_tt:0 "释放所有可释放国家及现有属国；缔结摩尔婚约时保留威斯特摩尔。大边区以“加韦德内战”为由对我们宣战，目标为加韦顿；格威克、西山、鹰冠、金菲尔德和威斯特摩尔加入大边区一方，受摩尔婚约保护的威斯特摩尔除外。\n§R无法手动议和。§! 大边区一方攻占加韦顿，或加韦德对大边区取得 §Y99§! 战争分数时，将触发相应的战争结束事件。"
 gcd_welyam_lords_victory_tt:0 "§R大边区吞并加韦德，当前加韦德玩家将失去国家。§! 格威克、西山、鹰冠和金菲尔德成为大边区的附庸。未受婚约保护而参与叛乱的威斯特摩尔保持独立。"
 gcd_welyam_crown_victory_tt:0 "§G加韦德吞并大边区、格威克、西山、鹰冠、金菲尔德和威斯特摩尔。§! 已缔结摩尔婚约时，威斯特摩尔保留原属国身份。\n§Y威利亚姆改革§!灾难立即结束，停用灾难机制，只移除明确持续到灾难结束的修正；其余修正保留原期限。\n自动完成第五列全部五个任务。\n没收贵族 §Y20%§! 土地。获得 §Y“王室的胜利”§!，持续 §Y30 年§!：贵族影响力 §Y−20%§!、月度自治度 §G−0.1§!、陆军维护费 §G−20%§!、税收效率 §G+20%§!。\n启用一级政府改革 §Y“加韦德君主制”§!，开放议会、王室能力与强制通过议案决议。"
 gcd_welyam_westmoors_defected_tt:0 "威斯特摩尔已脱离王室，加入敌方阵营。"
 gcd_welyam_no_manual_peace_tt:0 "加韦德内战只能由加韦顿陷落或加韦德达到 99 战争分数后触发的事件结束，不能手动或单独议和。"
 cb_gcd_gawedi_civil_war:0 "加韦德内战"
 cb_gcd_gawedi_civil_war_desc:0 "大领主与王室的决裂。夺取加韦顿，或由王室在达到 99 战争分数时统一王国。"
 gcd_gawedi_civil_war_capital:0 "夺取加韦顿"
 gcd_gawedi_civil_war_capital_desc:0 "大边区一方必须攻占加韦顿。"
 GCD_GAWEDI_CIVIL_WAR_NAME:0 "加韦德内战"

 # 修正：结束条件提示直接携带三条规则，确保当前灾难图标能读取，开局选项共用规则文字。
 gcd_welyam_reform_end_condition_tt:0 "王室着手整顿财源、军役与税赋，大领主们不愿放弃旧日权力。\n\n§Y以下三条特殊机制仅在威利亚姆改革灾难期间生效：§!\n\n§R1. 加韦德内战§!：贵族忠诚度低于§Y20§!并持续§Y一年§!，将触发大领主反对王室的内战。接受「奥尔德沃德会议」的誓言后，内战将不再触发\n§R如果你决心以铁与血荡清王室的敌人，你也可以尝试。§!\n\n§Y2. 贵族叛军与贷款禁令§!：每§Y两年§!生成一支§Y12k§!贵族叛军，并禁止向富商贷款。完成任务§Y“国王的左膀右臂”§!后，停止后续叛军并解除贷款禁令。\n\n§Y3. 威斯特摩尔倒戈§!：其仍为我国属国且独立倾向大于§Y50§!时，在§Y阿德肖叛乱§!中，或我国主动对§Y洛伦特、皇帝§!宣战时，将独立并加入敌方阵营。§R加韦德内战爆发时，其无论独立倾向高低都会反对王室。§!\n§G缔结摩尔婚约后，威斯特摩尔将不再叛离我们。§!"
 gcd_welyam_civil_war_rule_tt:0 "§R1. 加韦德内战§!：贵族忠诚度低于§Y20§!并持续§Y一年§!，将触发大领主反对王室的内战。接受「奥尔德沃德会议」的誓言后，尚未爆发的内战将不再触发。"
 gcd_welyam_rebels_rule_tt:0 "§Y2. 贵族叛军与贷款禁令§!：每§Y两年§!生成一支§Y12k§!贵族叛军，并禁止向富商贷款。"
 gcd_welyam_westmoors_rule_tt:0 "§Y3. 威斯特摩尔倒戈§!：其仍为我国属国且独立倾向大于§Y50§!时，在§Y阿德肖叛乱§!中，或我国主动对§Y洛伦特、皇帝§!宣战时，将独立并加入敌方阵营。§R加韦德内战爆发时，其无论独立倾向高低都会反对王室。§!\n§G缔结摩尔婚约后，威斯特摩尔将不再叛离我们。§!"
 gcd_welyam.10.d:0 "作为威利亚姆改革中规模最大、影响最深的一项，富商议会的成立令许多人，尤其是大领主们感到震惊。他们最初由王国中最有权势的十二位商人和生意人组成，由威利亚姆的首席顾问和导师、神秘的德里克·德兰领导。"
 gcd_welyam.20.d:0 "威利亚姆用这一年半的时间化解反对。他先花数月争取艾伦河下游较支持改革的领主。这些人能够从商人势力壮大所带来的利润中获益，因此比起维持现状，更愿意支持改革。随后，他又与立场较温和的领主会面，包括西部山地的拉姆斯盖特家族，以及他在艾伦荒野的表亲铜枪家族。谈判虽未使所有领主站到国王一边，至少让不少人在叛乱问题上保持中立。局势一旦失控，王室便有了更大的胜算。\n\n但最顽固、最传统的贵族仍未让步。大边区的戴尔家族，以及守卫埃斯坎边境的奥德斯克家族和巴尔沃德家族，都坚决反对威利亚姆改革。最终，为争取他们勉强同意，威利亚姆召开了奥尔德沃德会议。会议地点位于加韦顿对岸、艾伦河的另一侧。国王作出多项政治让步后，改革终于得以通过，内战威胁也随之解除。"
 gcd_welyam.21.d:0 "「我才不关心你们有什么意见，奥德斯克家族和巴尔沃德家族的领主说得没错：格威克家族那个所谓的『国王』，虽说现在还只是个不谙世事的小屁孩，但他很快就会长大成人。到那时又当如何？我们必须趁着那个『富商议会』还未完全掌权，我们这些领主权势尚在的时机，抓住当下的主动权。召集你的军队、你的友人，几乎所有受过你恩惠、欠你人情的人，向加韦顿进军！」\n\n——大边区的戴尔，致加韦德境内诸多大领主的一封信"
 gcd_welyam.40.d:0 "尽管威斯特摩尔多年来一直是加韦德的封臣，虽然一直保持着相当的自治，但他们的人民仍渴更多的自由——也就是独立。\n\n如今加韦德的紧张形势终于让他们抓住了机会。威斯特摩尔已宣布独立并将向加韦德宣战。"
 gcd_welyam.100.d:0 "大领主已经对我们的改革失去信心，他们决定采取任何可能的手段制止改革，哪怕这意味着战争。"
 gcd_welyam.101.d:0 "加韦顿已经陷落，大领主们已决定罢黜格威克家族的王位并以大边区的戴尔家族取而代之，新国王决定为境内的各大领主分权，防止大领主的权势再遭威胁。"
 gcd_welyam.102.d:0 "内战结束了，加韦德境内已经没有任何仍有能力召集军队的大领主了，他们在忠于王室的军队面前不堪一击，如今威利亚姆的改革再无任何阻力。加韦德万岁！"
