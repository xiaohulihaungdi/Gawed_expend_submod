 gawed_yongdongbianqu.10.t:0 "克洛维赴加韦顿求援"
 gawed_yongdongbianqu.10.d:0 "事件文本待补。"
 gawed_yongdongbianqu.1.t:0 "克洛维启行之歌"
 gawed_yongdongbianqu.1.d:0 "诸君且将杯盏放下，听我唱少年的远行，唱北海结霜的船索，唱失落王家的姓名。白湾的流亡者寄居异乡，年年说起归途，故国只剩一把旧匙，被贴身藏在衣服。\n\n克洛维幼时听母亲讲，灰潮怎样淹没城墙，姑姑弗丽达身陷宫廷，先祖的王座落入他人掌。他将木剑横在膝前，许下无人当真的誓言：“我要使故国重获君王，使流浪的人重见家园。”\n\n后来木剑换作长剑，少年的肩膀渐渐宽厚，他随老兵操练阵列，随林地人追猎野兽。流亡者、骑士与佣兵，闻讯来到他的门前，有人盼望重归故土，有人盼望封邑与银钱。\n\n可誓言不能充作军粮，长剑不能修好船舷，他便来到加韦顿，将请求述于王座之前。君王听罢展开地图，手指停在北方疆土：“我将给你银钱与兵士，为你重开复国的道路。”\n\n克洛维解下佩剑，将它横放在王座阶前，许诺永远铭记今日，铭记雄鹰赐予的恩典。书记官将誓词写下，印玺压入鲜红的蜡，一页薄薄的羊皮纸，从此随他的命运漂向天涯。\n\n铁匠通夜锻打铠甲，粮袋堆满出海的港口，鹰旗下的披甲骑士，奉命陪他向东方远走。父亲替他扶正佩剑，母亲为他系紧衣裳：“愿你赢得先祖的土地，也愿你平安回到故乡。”\n\n号角响过最后一遍，船夫解开岸边的缆，克洛维立在船头，看故乡渐成遥远的暗岸。“我要带姑姑走出宫门，使湾人重获昔日荣光；愿今日与我同行的人，都能活着分得胜利的奖赏。”\n\n后世的歌者唱到这里，常使满堂宾客振奋，唱银钱怎样化作长矛，唱少年怎样赢得信任。那时诸侯的誓言尚新，剑与剑相碰，清亮作响；谁知有朝一日，这些剑竟要在彼此胸前重新举扬。"
 gawed_yongdongbianqu.2.t:0 "白湾王冠之歌"
 gawed_yongdongbianqu.2.d:0 "如今请把酒杯斟满，听复国的长歌再起，听鹰旗下的铁骑，踏过北方的土地。克洛维率领湾人向前，穿过箭雨与燃烧的城门，灰王的军阵终于溃散，断剑残肢遗落满地。\n\n流亡者亲吻故乡石路，老人抚摸残破的门框，有人寻回埋藏的银器，有人只寻见亲人的坟场。教士捧着阵亡的名册，将姓名念到天亮，那些人曾应赴庆功宴，如今只留空位与旧伤。\n\n加冕那日海风暂息，阳光落在白湾城头，百姓挤满桥梁与台阶，将花枝抛向战马四周。克洛维将一个孩子抱起，让他坐在自己的鞍前，于是连最贫穷的人，也得以分享王者归来的荣耀。\n\n猛犸大厅重燃灯火，旧冠的裂痕已被锤平，弗丽达走到侄儿面前，替他拂去肩甲上的尘。教士将圣油点上额头，问他是否愿意守护子民，他将手掌按在剑上，回答声传遍先祖的厅。\n\n“愿我的城门容纳求告者，愿我的法度庇护贫弱，愿田野不再荒芜，愿孩子不必在地窖里躲过兵祸。”于是金冠落在他的头上，号角自厅门吹响：“向克洛维致敬！永冻边区的国王！”\n\n新王向并肩作战的人举杯，又谢过远来的鹰旗，加韦德的使者起身，腰间印玺映着灯火熠熠。“王廷必将欣闻喜讯，也必记得昔日的约言。”克洛维含笑饮尽美酒，尚未细想那句话里的分量。\n\n那夜长桌摆到厅外，流亡者谈论重建家园，骑士谈封地，商人谈港口，诗人将英雄比作先贤。弗丽达悄然走出宴席，将面包分给偏殿的伤员；那里也有半兽人的面孔，正惊惶地等候明天。\n\n而在欢宴尚未散去时，军官已展开城防的图纸，问过塔楼、粮仓与军械库，接过守门人的钥匙。年轻的国王坐在灯下，以为长途跋涉终于到岸；天明以后，他才将懂得，赢得王国的人还须学会怎样把它掌管。"
 gawed_yongdongbianqu.4.t:0 "白湾的归化"
 gawed_yongdongbianqu.4.d:0 "永冻堡陷落以后，联军又用了数日，才将盘踞在塔楼和地下甬道里的兽人肃清。那些地方原是旧王朝为抵御外敌修筑的，如今熟悉道路的湾人领着加韦德军士逐门搜查，往往要付出几条性命，才能夺下一间军械室或一段阶梯。克洛维亲自参加了最初的搜捕，也准许将杀害俘虏、焚烧村庄的兽人军官绞死在城墙下。他的将士大多曾受过灰王的统治，有些人进城时还带着亲属被杀的消息；他们对兽人的憎恨，并不比加韦德人少。然而，待成队的俘虏被押入庭院，军官们开始按姓名、家世和旧日职务登记审问时，两军之间渐渐有了争执。加韦德驻军要求将曾在灰王麾下服役的半兽人一并看管，克洛维却已向其中一些人颁下赦免，允许他们交出兵器，回到各自家中。这使搜查的士兵屡次遇到新王的卫兵阻拦，也使几位刚刚埋葬同袍的加韦德骑士，在国王面前说出了失礼的话。\n\n争执最终落到了马洛什身上。他是布苏拉尔的儿子，也是弗丽达的儿子；单凭这两重身份，就足以使驻军统领坚持要求将他交出。在加韦德人看来，克洛维能够凭借王家血统召集一支复国大军，灰王的后人同样可能召回那些尚未归顺的兽人。今日放他离开，来日或许就要让更多士兵渡海，替这份宽厚偿命。克洛维听完这些理由，却始终不肯准许军士带走自己的表弟。他要求统领列出马洛什应受审判的罪行，统领则反问，新王是否愿意替此人今后的一切行为担保。两人在尚未清理干净的议事厅中争论了许久，几位曾并肩冲击兽人阵列的骑士站在一旁，谁也未能劝服对方。到最后，克洛维以国王的身份命令马洛什留在他的保护之下，驻军统领没有当众违抗，只要求将这道命令写下来，签名盖印，以便呈送加韦顿。\n\n消息传到弗丽达那里时，已有半兽人的家属来到她居住的偏殿求助。他们知道这位公主曾为灰王生下儿子，便指望她能够使新王听见自己的申辩。弗丽达收留了这些人，又派侍从去寻找被军士带走的亲属；驻军很快发现，自己要审问的人，有些躲进了王室居所，有些带着公主的书信，要求得到与马洛什一样的保护。军官们对此愈发愤怒，克洛维却认为，姑姑有权为她认识的人求情，驻军不能未经查证，便把求情者与俘虏一同视作敌人。清剿仍在继续，但双方已各自关押俘虏，各自派兵看守门户，再不肯轻易向对方交人。送回加韦德的第一封报告，原本记载着攻克永冻堡的战功；随后的信件里，却越来越多地出现了弗丽达与马洛什的名字。驻军统领请求王廷尽快作出裁断，因为克洛维正在为这些人承担王家的信用，而留在永冻堡的加韦德将士，已经不愿接受他的保证。"
 gawed_yongdongbianqu.5.t:0 "永冻边区的归属"
 gawed_yongdongbianqu.5.d:0 "加韦德驻军统领正式请求处死弗丽达。他在呈交王廷的报告中列举了她收容俘虏、阻拦搜查、拒绝交出马洛什的种种行径，指责这位公主仗着克洛维的庇护，使奉命驻守永冻堡的军队无法行事。几名贵族在报告上署了名，他们曾亲自带兵攻打城堡，也有人在清剿中失去了兄弟和侍从。在他们看来，既然弗丽达已经得到解救，就应当协助联军清除灰王留下的势力；如今她却替半兽人求情，将征服者的后裔藏在王室居所之中，甚至使新王为了这些人与加韦德反目。军官们因此认定，她早已背弃自己的家族与故国，只是借着公主的身份逃过了最初的审查。报告请求王廷以叛国罪裁处此事，并强调，若因克洛维的反对而撤回军令，驻军今后便再也无法约束永冻边区的君臣。\n\n弗丽达并未否认自己做过的事。她承认收留了那些向她求助的人，也承认曾派侍从阻止士兵将马洛什带走。她是旧王朝最后的公主，布苏拉尔攻占她的故国以后，强迫她成为妻子，并使她生下了一个半兽人儿子。如今灰王的统治已经结束，她仍须向解救自己的人说明，为何一个母亲不肯交出自己的孩子。她在申辩中请求联军逐一审问俘虏，惩办确实犯下罪行的人，也请求他们容许未曾作恶的半兽人留下生活。那些人里有她认识多年的宫廷仆役，有照料过她的妇女，也有生来便在永冻堡、从未参加过战争的平民。她知道驻军憎恨灰王，知道他们有死去的同袍需要安葬，却不肯因此替他们指认这些人的罪。驻军统领收到她的答复后，再次催促王廷尽快下达处决的敕令。\n\n克洛维明确拒绝了驻军的要求。他不肯将姑姑交给加韦德人，更不承认军官们有权越过自己，裁定一位王室成员的生死。他的使者在王廷中直言，所谓审判，不过是在替进一步控制永冻边区寻找借口：先以包庇兽人的罪名除掉弗丽达，再将她庇护过的人尽数收监，此后谁若反对，便也可以被指为灰王余党。佛罗伦森王室所剩无几，加韦德若连这些幸存者也不愿容下，克洛维便不得不怀疑，自己究竟是受援复国的君王，还是替他人占领故土的臣仆。阿德肖的使者同样站在他的一边，要求王廷顾念弗丽达与他们的亲族关系。两国的领主已经为此互通书信，而永冻堡中，克洛维也增派了护卫看守姑姑的居所。\n\n王廷中的主战者认为，此时退让只会使往后的整合更加艰难。克洛维既然接受了加韦德的援助，便应当承认王冠在此事上的裁决；若他为一个被判有罪的亲属举兵，那便连同阿德肖一起，以叛乱论处。然而，主张宽宥的顾问提醒我们，克洛维已经公开许诺保护弗丽达，阿德肖诸领主也已表明立场，行刑的敕令一旦送抵永冻堡，两国便会起兵反抗。若准许弗丽达活下去，眼下的从属关系尚能维持，但往后就须顾及他们的王家、领主与旧有法度，逐步削减其权力，经过长久经营才能完成吞并。驻军仍在等候王廷的答复，克洛维则坚持，在得到足以使他信服的裁断以前，没有人能够将他的姑姑带走。"
 gawed_yongdongbianqu.8.t:0 "加韦顿的囚王"
 gawed_yongdongbianqu.8.d:0 "诸君若还记得盛宴，记得金杯怎样相撞，如今请将欢笑收住，听那王冠最后的回响。故国的公主已死，克洛维将敕令投入炉火，永冻边区与阿德肖的骑士，再次披甲离开村落。\n\n可战场没有等候决斗的敌王，只有泥路与溃散的军阵，昔日的盟友认得他的旗帜，也熟悉他的号令。他三次命人举起王旗，第三次已无人回答，一名曾向他祝寿的军官，走上前来，收去了他的佩剑。\n\n押送的队伍进入加韦顿，城门上的鹰纹依旧鲜明，他记得自己初来时，马蹄怎样敲响平整的石径。那时侍从引他走过长廊，去领受银钱与荣光；如今钥匙在前方转动，将他引向王城深处的石房。\n\n狱卒取走腰带与斗篷，留下粗布衣裳，屋中只有窄床、水罐，与一扇高高的小窗。最初他还刻痕记日，等候觐见，等候故乡的信；后来只凭脚步的轻重，便认得送饭的人是否换了新人。\n\n有一年他请求纸笔，写下马洛什的姓名，又问阿德肖的田野，是否已经重新播种。信被带出那道铁门，再没有回音传来，岁月便沿着潮湿的墙缝，在他的鬓边积成霜白。\n\n城中庆典的乐声，偶尔也传到牢里，歌者仍唱白湾的远征，唱雄鹰怎样扶起失落的王旗。他坐在门边听着，想起姑姑替他拂去肩上的尘土，歌里的青年又一次走进王廷，而他的故事已无人接续。\n\n最后一冬，他病得很重，已无力移近水罐，老狱卒替他掖好毯子，听他询问向东的航船。“天明替您去问。”狱卒答道，他便轻轻点头；待那一点冬日阳光落上床沿，他已不能再等候。\n\n他未曾获得赦免，也未曾再见故乡的海岸，王冠与长剑留在别处，囚籍上添了一行简短的记载。诸君若还记得盛宴，就为那空位留一点灯光：克洛维曾渡海取回一个王国，余生却再未走出一间石房。"
 gawed_yongdongbianqu.6.t:0 "背叛！"
 gawed_yongdongbianqu.6.d:0 "释放两国，由永冻边区宣战，阿德肖结盟参战并接收西寒湾。"
 gawed_yongdongbianqu.7.t:0 "阿德肖叛乱胜利（隐藏）"
 gawed_yongdongbianqu.7.d:0 "叛军占领加韦顿且战争分数至少75后，结束战争并割让贝维克海岸。"
 gawed_yongdongbianqu.10.a:0 "提供援助。"
 gawed_yongdongbianqu.1.a:0 "让雄鹰与他一同渡海。"
 gawed_yongdongbianqu.2.a:0 "向永冻边区的国王举杯！"
 gawed_yongdongbianqu.4.a:0 "将此事呈报王廷。"
 gawed_yongdongbianqu.5.a:0 "按叛国罪处决弗丽达。"
 gawed_yongdongbianqu.5.b:0 "准许弗丽达留在克洛维的保护之下。"
 gawed_yongdongbianqu.8.a:0 "将他的名字从囚籍中划去。"
 gawed_yongdongbianqu.6.a:0 "那就让他们见识真正的战争。"
 gawed_yongdongbianqu.7.a:0 "履行战败条款。"
