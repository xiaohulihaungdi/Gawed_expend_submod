 gcd_marriage_moorman_loyal_tt:0 "§G威斯特摩尔此后不会背叛我们。§!\n无论独立倾向高低，在加韦德内战、阿德肖叛乱及我国对洛伦特或皇帝宣战时均不会叛离我们。"
