 # 新增：用户截图一的正式开局正文；其余未给定的事件正文明确占位。
 gcd_welyam.1.t:0 "第一道召集令"
 gcd_welyam.1.d:0 "乔恩亲王的死讯传回加韦顿已有一年，他的盔甲仍挂在王座厅上。年轻的韦利亚姆三世不愿再听人说，加韦德只需另一位勇武的国王。他翻阅父亲出征时的文件，只感到沮丧和恐惧，大领主聚敛财富，训练兵士，在自己的领地如国王一般，王室开支日增，却无人排忧解难。加韦德曾凭借诸家族的誓言征服半个坎诺；如今国王若要召集一支军队，仍得逐家恳请他们履约。\n\n德里克·德兰带来一份提议：召集商人与市民，为王室筹措稳定的财源，重新核定军役和税赋，为王室提供稳定的兵源和税源。大领主们闻讯而来，重申自己古老的权力；阿兰娜开始疑神疑鬼，她显得比得到丈夫死讯时更悲痛；德兰更卖力地工作，传言却指向他密会氏族首领。韦利亚姆尚未宣布任何改革，王国已到了分裂的边缘。他将父亲留下的剑放在一旁，提笔写下了第一道召集令。"
 gcd_welyam.1.a:0 "发出第一道召集令。"
 gcd_welyam_reform:0 "威利亚姆改革"
 gcd_welyam_reform_desc:0 "王室着手整顿财源、军役与税赋，大领主们却不愿放弃旧日权力。\n\n§Y以下三条特殊机制仅在威利亚姆改革灾难期间生效：§!\n\n§Y1. 加韦德内战§!：贵族忠诚度低于§Y20§!并持续§Y一年§!，将触发大领主反对王室的内战。接受“奥尔德沃德会议”的誓言后，尚未爆发的内战将不再触发。\n\n§Y2. 贵族叛军与贷款禁令§!：每§Y两年§!生成一支§Y12k§!贵族叛军，并禁止向富商贷款。完成任务§Y“国王的左膀右臂”§!后，停止后续叛军并解除贷款禁令；已有叛军仍须处理。无合适省份时，叛军生成会延后。\n\n§Y3. 威斯特摩尔倒戈§!：其仍为我国属国且独立倾向大于§Y50§!时，在§Y阿德肖叛乱§!中，或我国主动对§Y洛伦特、皇帝§!宣战时，将独立并加入敌方阵营。§R加韦德内战爆发时，其无论独立倾向高低都会反对王室。§!\n§G缔结摩尔婚约后，威斯特摩尔不受上述倒戈和内战参战规则影响。§!"
 gcd_welyam_reform_rules_tt:0 "进入§Y威利亚姆改革§!灾难：全国叛乱度§R+2§!，贵族忠诚均衡点§R−50%§!，政府改革点数增长§G+20%§!。\n§Y以下三条特殊机制仅在威利亚姆改革灾难期间生效：§!"
 gcd_welyam_placeholder_desc:0 "事件正文待补。"
