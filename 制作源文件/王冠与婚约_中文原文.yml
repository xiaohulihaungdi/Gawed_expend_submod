 # 新增：正文与三个选项采用用户原文，保留四个长段落。
 gcd_marriage.1.t:0 "王冠与婚约"
 gcd_marriage.1.d:0 "1450年夏，加韦德王国终于从连年的紧张中得到片刻喘息。韦利亚姆案头的奏章却并未减少：有人催促他继续推行改革，有人要求归还被王室收回的权力，而几乎所有人都在打听同一件事——国王将迎娶谁。宫廷里流传着他与卡琳娜·德兰的传闻。韦利亚姆喜欢她的坦率，也记得她曾在众人不敢开口时，当面指出一项王室命令会让地方官吏无所适从。他不愿把这样的女子只看作德里克·德兰的侄女。但他也清楚，一旦迎娶卡琳娜，商人议会的财力与办事之人便会站到改革身后；从那一天起，他所做的每一件事，也都可能被称作德兰家族的主意。\n\n老牌领主们有另一番说法。在他们看来，王国的税赋可以交给书记官计算，边境上的城堡和士兵却不能只靠账簿维系。一位领主对前来探问的宫廷使者说：“国王需要我们出兵时，记得我们的名字；国王决定婚事时，难道只记得商人的名字？”他们推举自家女子，并非仅为争取王后的位置。若韦利亚姆愿意与他们联姻，许多已经准备以刀剑回答改革的家族，便有了重新坐回谈判桌的理由。韦利亚姆知道他们说得不全是托词：他可以颁下命令，却不能靠命令让每一座城堡都心甘情愿地开门。\n\n威斯特摩尔的氏族则带来了第三份婚约。使者提出，若氏族女子成为加韦德的王后，各氏族便共同向王冠宣誓，将威斯特摩尔并入王国。他们希望这不是一次以婚姻换取土地的交易：王室必须将他们当作加韦德的一部分，而不是战败后被迫低头的人。韦利亚姆听他们谈起西方的河口、海岸和航路，心中也想到那些尚未绘入王国地图的远方。若有朝一日，加韦德的船驶向埃兰提尔，威斯特摩尔人或许会比宫廷里的任何人都更早知道该如何越过那片海。\n\n夜深时，韦利亚姆独自重读三份婚约。卡琳娜能与他一道把改革推向前方；与老牌领主联姻，或许能让王国免于再度流血；威斯特摩尔的婚约，则会把王冠的疆界和目光一同引向西方。他想到的终究不是地图上的得失，还有那位今后要与他共同承担这一切的人。天亮之前，他必须给出答复。"
 gcd_marriage.1.a:0 "请卡琳娜·德兰入宫。我希望她成为我的王后。"
 gcd_marriage.1.b:0 "接受领主们的婚约。加韦德需要一次和解。"
 gcd_marriage.1.c:0 "答应摩尔人氏族。让威斯特摩尔与我们共同迎向西方。"
 gcd_marriage_queen_karina:0 "卡琳娜王后"
 gcd_marriage_great_lords:0 "大领主的婚约"
