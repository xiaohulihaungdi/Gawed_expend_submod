 # 新增：按用户要求留空事件标题与正文，仅保留可点击的通用按钮和修正名称。
 gcd_celmaldor.1.t:0 "马尔多里安之叹"
 gcd_celmaldor.1.d:0 "马尔多里安站在港口旁，看着躯体庞大船壳崭新的「霜矛号」停在码头。他今年40岁，出生于凯尔马尔多的市区，他的父母为了纪念凯尔马尔多的建立者马尔多里安为他起了这个名字。\n\n对于精灵来说，这个年纪实在是年轻的过分，但年轻不代表没有自己的想法，实际上他今天来港口，正是为了给父母送行。\n\n加韦德的士兵已经占领了这里，并下令没收精灵的财产。大部分精灵为了自己的安全，决定逃离这座不再欢迎他们的城市：而新进维修的「霜矛号」正是最适合此行的船只，当年他们正是乘此船而来，如今又要乘此船而去。说来讽刺，几年前凯尔马尔多市长为了贸易霸权力排众议修建的豪华舰队，如今却正好成为了他们的难民船，也算是起到作用了吧。\n\n当然也有执意坚守在此的居民。马尔多里安正是其中之一，他从未见过埃兰提尔，也从未经历过船上生活，他的家乡就是凯尔马尔多，事实上他爱说艾伦语胜过精灵语，逃离对他来说不是回家，而是永远离开家乡。于是他拒绝了父母的请求，尽管看着他们担忧的眼神令他心碎，他相信凯尔马尔多，他的家乡，永远不会排斥他。"
 gcd_celmaldor.2.t:0 "德兰的旧宅"
 gcd_celmaldor.2.d:0 "德里克·德兰站在长满青苔的石阶前，加韦德没收了当年击垮他们的精灵商人的财富，他的行会此时正紧锣密鼓地筹备替代即将停业的精灵商业行会。他执意来到这里，二百年前，这里见证了他的祖先从一个卖杂货的商贩到行会举足轻重的富商。五十年前，他的父亲第一次带他来到这里，古老的石墙刷上崭新的石灰，昂贵的家具占据了一大半空间，历代先祖的画相排列有序，出自著名画家之手，然而他印象最深的是空间的逼仄，以及修葺也无法阻止漏雨的房顶。\n\n父亲临终前，像历代祖先一样嘱托儿子：守护好祖宅，别让祖先蒙羞。然而他失约了，二十年前逃离凯尔马尔多时，他带走了剩余的大部分财产。推开残破的木门，拆下锈蚀的门栓，打开锈迹斑斑的保险箱，幸运的是，祖先的画相仍在。\n\n管家气喘吁吁地赶来，请他参与必要的工作，德兰不得不将思绪放下，跟着管家向市政厅走去，老宅消失在视线中。他主持收缴精灵商人的财富，这些人有些已经逃走，剩下的瑟瑟发抖，敢怒而不敢言，全然没有了当年驱逐他时的骄傲。完成了一天的工作，他猛然惊觉。"
 gcd_celmaldor.3.t:0 "最终方案"
 gcd_celmaldor.3.d:0 "国王陛下万岁，凯尔马尔多指挥官敬启：\n\n士兵们出色的结束了街头的暴动。毫不出乎我们的预料，失去财产的精灵对我们进行抗议，而抗议很快演变成暴动。加韦德的士兵们临危不惧，迅速清除了所有带头的精灵，并以此暴动为理由逮捕了全城仅剩的精灵居民。\n\n我已收到王家顾问德里克.德兰送来的王室法令，并积极配合大致完成了精灵财产的分配工作，在士兵统计下，全城所有的精灵都已驱逐完毕，德里克顾问自愿支付了愿意迁走的精灵的路费，愿卡斯特罗斯保佑他的仁慈。\n\n阿德肖领主向我带来了一份有意思的提议，他希望将凯尔马尔多改名以彻底清除此城的精灵影响，新城将以阿申海斯命名。我认为此想法很有用处，特此向陛下汇报，请您过目。"
 gcd_celmaldor.4.t:0 "凯尔马尔多的精灵难民"
 gcd_celmaldor.4.d:0 "今日维奈尔港口格外的热闹，精灵们发现了一艘无比庞大的船只正在逼近，一些年长的精灵立刻认出了船上「霜矛号」的标志。经过简短的交流，维奈尔精灵立刻明白了他们同族的遭遇，此事对他们来说意义非凡，这意味着维奈尔的返乡计划获得了极大的助力。"
 gcd_celmaldor.continue:0 "继续"
 gcd_celmaldor_elven_refugees:0 "凯尔马尔多的精灵难民"
 gcd_celmaldor.2.a:0 "德兰自己的画相去哪了？"
 gcd_celmaldor.3.a:0 "以下是精灵暴动头目（已被清除）：「马尔多里安……」"
