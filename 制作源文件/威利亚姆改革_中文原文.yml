 gcd_welyam.101.t:0 "加韦德内战：加韦顿陷落"
 gcd_welyam.101.a:0 "王室败局已定。"
 gcd_welyam.102.t:0 "加韦德内战：王室的胜利"
 gcd_welyam.102.a:0 "重归王室治下。"
 gcd_welyam.103.t:0 "内战暂缓"
 gcd_welyam.103.d:0 "王室仅存首都，已无可用于建立大边区的非首都领土。内战尚未开始；大领主的威胁仍未消失。"
 gcd_welyam.103.a:0 "我们需要应对这场危机。"
 gcd_welyam_first_council:0 "第一次富商议会"
 gcd_welyam_royal_right_hand:0 "国王的左膀右臂"
 gcd_welyam_noble_settlement:0 "奥尔德沃德会议"
 gcd_welyam_crown_consolidation:0 "大领主之誓"
 gcd_welyam_great_hunt:0 "威利亚姆的大围猎"
 gcd_welyam_great_hunt_karina:0 "威利亚姆与卡丽娜的大围猎"
 gcd_welyam_council_preview_tt:0 "§Y事件前瞻：第一次富商议会§!\n事件选项将给予 §G25§! 政府改革点数、§G100§! 金币，以及 §G−20%§! 顾问花费。顾问修正持续到当前君主死亡或改革灾难结束，以先发生者为准。"
 gcd_welyam_rebels_stopped_tt:0 "§G解除威利亚姆改革施加的富商贷款禁令。§!\n此后不再触发本灾难两年一次的贵族叛军；已有叛军仍需处理。贵族忠诚均衡点 §R−10%§!，持续到灾难结束。"
 gcd_welyam_tier2_reform_tt:0 "若尚未采用 §Y赋予富商议会权力§!，将当前二级政府改革替换为此改革；其他层级政府改革保持不变。"
 gcd_welyam_task3_routes_preview_tt:0 "§Y完成方式一§!：贵族影响力至少 50，授予“王冠之上的权力”，拥有 200 金币。\n将触发 §Y“奥尔德沃德会议”§! 事件：贵族忠诚均衡点 §G+30%§!、贵族影响力 §Y−10%§!，持续到当前君主死亡或改革灾难结束；此后加韦德内战不再触发。\n\n§Y完成方式二§!：贵族影响力低于 30，贵族特权少于 2 项。\n将触发 §Y“大领主之誓”§! 事件：没收贵族 §Y20%§! 土地，贵族忠诚度立即 §R−20§!；获得持续 §Y10 年§! 的全国叛乱度 §R+2§!、月度自治度 §G−0.1§! 修正，灾难结束时提前移除。"
 gcd_welyam_settlement_preview_tt:0 "§Y事件前瞻：奥尔德沃德会议§!\n贵族忠诚均衡点 §G+30%§!、贵族影响力 §Y−10%§!，持续到当前君主死亡或改革灾难结束；此后加韦德内战不再触发。"
 gcd_welyam_consolidation_preview_tt:0 "§Y事件前瞻：大领主之誓§!\n没收贵族 §Y20%§! 土地，贵族忠诚度立即 §R−20§!；全国叛乱度 §R+2§!、月度自治度 §G−0.1§!，持续 §Y10 年§!，改革灾难结束时提前移除。"
 gcd_welyam_civil_war_prevented_tt:0 "§G选择此选项后，加韦德内战将不再触发。§! 已经爆发的内战仍须通过战争结局结束。"
 gcd_welyam_hunt_preview_tt:0 "§Y事件前瞻：威利亚姆的大围猎§!\n事件选项将使所有阶层忠诚度 §G+10§!，并给予持续 §Y15 年§! 的人情增长 §G+20%§!、外交声誉 §G+2§!。若选择选项时配偶为 §YKarina Deland§!，该修正额外给予侵略扩张影响 §G−15%§!、外交声誉 §G+2§!（合计 §G+4§!）。改革灾难结束时，上述修正提前移除。"
 gcd_welyam_reform_finished_tt:0 "§G威利亚姆改革灾难立即结束。§! 停用全部灾难机制，解除本灾难施加的富商贷款禁令，并移除第一次富商议会、国王的左膀右臂、奥尔德沃德会议、大领主之誓及大围猎修正。"
 gcd_welyam_reform_modifier_duration_tt:0 "§Y改革灾难结束时，此项改革期修正提前移除；灾难结束后不再发放。§!"
 gcd_welyam_civil_war_start_tt:0 "释放所有可释放国家及现有属国；缔结摩尔婚约时保留威斯特摩尔。大边区以“加韦德内战”为由对我们宣战，目标为加韦顿；格威克、西山、鹰冠、金菲尔德和威斯特摩尔加入大边区一方，受摩尔婚约保护的威斯特摩尔除外。\n§R无法手动议和。§! 大边区一方攻占加韦顿，或加韦德对大边区取得 §Y99§! 战争分数时，将触发相应的战争结束事件。"
 gcd_welyam_lords_victory_tt:0 "§R大边区吞并加韦德，当前加韦德玩家将失去国家。§! 格威克、西山、鹰冠和金菲尔德成为大边区的附庸。未受婚约保护而参与叛乱的威斯特摩尔保持独立。"
 gcd_welyam_crown_victory_tt:0 "§G加韦德吞并大边区、格威克、西山、鹰冠、金菲尔德和威斯特摩尔。§! 已缔结摩尔婚约时，威斯特摩尔保留原属国身份。\n§Y威利亚姆改革§!灾难立即结束，全部灾难机制及改革期修正清除。\n没收贵族 §Y20%§! 土地。获得 §Y“王室的胜利”§!，持续 §Y30 年§!：贵族影响力 §Y−20%§!、月度自治度 §G−0.1§!、陆军维护费 §G−20%§!、税收效率 §G+20%§!。\n启用一级政府改革 §Y“加韦德君主制”§!，开放议会、王室能力与强制通过议案决议。"
 gcd_welyam_westmoors_defected_tt:0 "威斯特摩尔已脱离王室，加入敌方阵营。"
 gcd_welyam_no_manual_peace_tt:0 "加韦德内战只能由加韦顿陷落或加韦德达到 99 战争分数后触发的事件结束，不能手动或单独议和。"
 cb_gcd_gawedi_civil_war:0 "加韦德内战"
 cb_gcd_gawedi_civil_war_desc:0 "大领主与王室的决裂。夺取加韦顿，或由王室在达到 99 战争分数时统一王国。"
 gcd_gawedi_civil_war_capital:0 "夺取加韦顿"
 gcd_gawedi_civil_war_capital_desc:0 "大边区一方必须攻占加韦顿。"
 GCD_GAWEDI_CIVIL_WAR_NAME:0 "加韦德内战"

 # 修正：结束条件提示直接携带三条规则，确保当前灾难图标能读取，开局选项共用规则文字。
 gcd_welyam_reform_end_condition_tt:0 "完成任务§Y“威利亚姆之治”§!，或取得§Y加韦德内战§!胜利。\n\n§Y灾难期间特殊机制（以下仅作说明）：§!\n\n§Y1. 加韦德内战§!：贵族忠诚度低于§Y20§!并持续§Y一年§!，将触发大领主反对王室的内战。接受“奥尔德沃德会议”的誓言后，尚未爆发的内战将不再触发。\n\n§Y2. 贵族叛军与贷款禁令§!：每§Y两年§!生成一支§Y12k§!贵族叛军，并禁止向富商贷款。完成任务§Y“国王的左膀右臂”§!后，停止后续叛军并解除贷款禁令；已有叛军仍须处理。无合适省份时，叛军生成会延后。\n\n§Y3. 威斯特摩尔倒戈§!：其仍为我国属国且独立倾向大于§Y50§!时，在§Y阿德肖叛乱§!中，或我国主动对§Y洛伦特、皇帝§!宣战时，将独立并加入敌方阵营。§R加韦德内战爆发时，其无论独立倾向高低都会反对王室。§!\n§G缔结摩尔婚约后，威斯特摩尔不受上述倒戈和内战参战规则影响。§!"
 gcd_welyam_civil_war_rule_tt:0 "§Y1. 加韦德内战§!：贵族忠诚度低于§Y20§!并持续§Y一年§!，将触发大领主反对王室的内战。接受“奥尔德沃德会议”的誓言后，尚未爆发的内战将不再触发。"
 gcd_welyam_rebels_rule_tt:0 "§Y2. 贵族叛军与贷款禁令§!：每§Y两年§!生成一支§Y12k§!贵族叛军，并禁止向富商贷款。完成任务§Y“国王的左膀右臂”§!后，停止后续叛军并解除贷款禁令；已有叛军仍须处理。无合适省份时，叛军生成会延后。"
 gcd_welyam_westmoors_rule_tt:0 "§Y3. 威斯特摩尔倒戈§!：其仍为我国属国且独立倾向大于§Y50§!时，在§Y阿德肖叛乱§!中，或我国主动对§Y洛伦特、皇帝§!宣战时，将独立并加入敌方阵营。§R加韦德内战爆发时，其无论独立倾向高低都会反对王室。§!\n§G缔结摩尔婚约后，威斯特摩尔不受上述倒戈和内战参战规则影响。§!"
